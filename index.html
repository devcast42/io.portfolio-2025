<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/chuck.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Inline loader SVG, no network request needed -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Tilt+Neon:XROT,YROT@-45..45,-45..45&display=swap" rel="stylesheet">

    <title>Charles Castillo | Full Stack Developer</title>
    <meta name="description" content="Charles Castillo, Desarrollador Full Stack: React, TypeScript, Node.js, NestJS y PostgreSQL. Aplicaciones web para empresas y funcionalidades con IA." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://charles-castillo.dev" />
    <meta property="og:title" content="Charles Castillo | Full Stack Developer" />
    <meta property="og:description" content="Charles Castillo, Desarrollador Full Stack: React, TypeScript, Node.js, NestJS y PostgreSQL. Aplicaciones web para empresas y funcionalidades con IA." />
    <meta property="og:image" content="https://charles-castillo.dev/og-image.png" />
    <meta property="og:image:alt" content="Avatar 3D de Charles Castillo" />
    <meta property="og:locale" content="es_PE" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Charles Castillo | Full Stack Developer" />
    <meta name="twitter:description" content="Charles Castillo, Desarrollador Full Stack: React, TypeScript, Node.js, NestJS y PostgreSQL. Aplicaciones web para empresas y funcionalidades con IA." />
    <meta name="twitter:image" content="https://charles-castillo.dev/og-image.png" />
  </head>
  <body>
    <div id="boot-loader" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;z-index:999999;">
      <svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" style="animation:boot-spin 1.6s linear infinite">
        <circle cx="60" cy="60" r="6" fill="#b9ff66"/>
        <ellipse cx="60" cy="60" rx="36" ry="18" stroke="#b9ff66" stroke-width="2" fill="none" />
        <ellipse cx="60" cy="60" rx="36" ry="18" stroke="#b9ff66" stroke-width="2" fill="none" transform="rotate(60 60 60)" />
        <ellipse cx="60" cy="60" rx="36" ry="18" stroke="#b9ff66" stroke-width="2" fill="none" transform="rotate(-60 60 60)" />
      </svg>
    </div>
    <style>
      @keyframes boot-spin { to { transform: rotate(360deg) } }
      @keyframes boot-pulse { 0%,100% { filter: drop-shadow(0 0 0 rgba(185,255,102,0.0)) } 50% { filter: drop-shadow(0 0 16px rgba(185,255,102,0.35)) } }
      @keyframes boot-dot { 0%,80%,100% { opacity: .25 } 40% { opacity: 1 } }
      .boot-card { display:flex; flex-direction:column; align-items:center; gap:10px; padding:18px 22px; border-radius:16px; border:1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.06); box-shadow: 0 8px 28px rgba(0,0,0,0.35); }
      .boot-atom { animation: boot-spin 1.6s linear infinite, boot-pulse 2.2s ease-in-out infinite; }
      .boot-title { color:#b9ff66; font-family: Inter, sans-serif; font-size: 15px; letter-spacing: .4px; text-transform: none; }
      .boot-dots { display:flex; gap:6px; align-items:center; justify-content:center; }
      .boot-dots span { width:6px; height:6px; border-radius:50%; background:#b9ff66; animation: boot-dot 1.2s infinite; }
      .boot-dots span:nth-child(2) { animation-delay: .2s }
      .boot-dots span:nth-child(3) { animation-delay: .4s }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', function () {
        var boot = document.getElementById('boot-loader');
        if (boot) boot.remove();
      });
    </script>
  </body>
</html>
